name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  sanity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install analysis dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==1.26.4 pandas==2.2.2 pytest==8.2.0

      - name: Compile Python sources
        run: python -m compileall -q phofl_lab.py analyze_two_axis.py make_final_table.py run_step1.py run_step2.py run_step3.py run_step4.py

      - name: Validate notebook JSON
        run: python -c "import json; json.load(open('phofl_experiments.ipynb', encoding='utf-8'))"

      - name: Run repository checks
        run: pytest -q
