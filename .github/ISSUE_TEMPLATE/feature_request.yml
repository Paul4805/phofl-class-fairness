name: Feature request
description: Suggest an analysis, reproducibility improvement, or documentation change
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        This is a measurement repository, not a method-development project.
        Requests for new training methods are out of scope; requests for
        analysis, reporting, and reproducibility are welcome.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is missing or unclear?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What would you like to see changed?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope check
      description: Does this affect a claim in the paper, a table, or only tooling?
